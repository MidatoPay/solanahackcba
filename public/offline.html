<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <meta name="theme-color" content="#ffffff" />
    <title>Sin conexión · MidatoPay</title>
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100dvh; display: grid; place-items: center; padding: 24px; background: #fff; color: #242431; font-family: system-ui, sans-serif; }
      main { max-width: 360px; line-height: 1.6; }
      h1 { font-size: 28px; line-height: 1.2; }
      .brand { color: #b33c00; font-weight: 700; }
      a { display: inline-block; margin-top: 16px; padding: 12px 24px; border-radius: 14px; color: #fff; background: #a93600; text-decoration: none; font-weight: 600; }
      a:focus-visible { outline: 3px solid #4d46aa; outline-offset: 4px; }
    </style>
  </head>
  <body>
    <main>
      <p class="brand">MidatoPay</p>
      <h1>Necesitás conexión</h1>
      <p>Conectate a Internet para consultar tu cuenta, cobrar y pagar.</p>
      <p>Si estabas realizando una operación, revisá su estado al volver a conectarte antes de intentar otra.</p>
      <a href="/">Reintentar</a>
    </main>
  </body>
</html>
