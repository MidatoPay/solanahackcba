[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"
  AWS_LAMBDA_JS_RUNTIME = "nodejs22.x"
  # Only non-credential configuration values; all other secret scanning stays enabled.
  SECRETS_SCAN_OMIT_KEYS = "PAYMENTS_BASE_URL,MP_ENVIRONMENT,PAYMENTS_ENABLED,VITE_SOLANA_CLUSTER,ETH_RPC_URL"

[dev]
  command = "npm run dev -- --host 127.0.0.1 --port 5173"
  targetPort = 5173
  port = 8888
  functionsPort = 9999
  autoLaunch = false

[functions]
  directory = "netlify/functions"
  # Default zip-it-and-ship-it tracer mis-packages @privy-io/server-auth's
  # @hpke/* deps (conditional dual ESM/CJS exports) — it copies
  # @hpke/common/script/mod.js into the deploy zip but drops the relative
  # ./src/errors.js it requires, crashing contacts.js at cold start with
  # "Cannot find module './src/errors.js'". esbuild fully bundles instead
  # of copying node_modules, avoiding the mis-trace.
  node_bundler = "esbuild"

# Job de reconciliación de wallets — ver
# docs/superpowers/specs/2026-08-08-background-reconciliation-design.md.
[functions."reconcile-wallets"]
  schedule = "*/15 * * * *"

[functions."payments-dispatch"]
  schedule = "* * * * *"

[functions."transfers-dispatch"]
  schedule = "* * * * *"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"
    Content-Type = "application/javascript; charset=utf-8"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Cache-Control = "no-cache"
    Content-Type = "application/manifest+json; charset=utf-8"

[[redirects]]
  from = "/security/*"
  to = "/.netlify/functions/security/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/security"
  to = "/.netlify/functions/security"
  status = 200
  force = true

[[redirects]]
  from = "/wallet"
  to = "/.netlify/functions/wallet"
  status = 200
  force = true

[[redirects]]
  from = "/treasury/export-access"
  to = "/.netlify/functions/treasury-export-access"
  status = 200
  force = true

[[redirects]]
  from = "/transfers/*"
  to = "/.netlify/functions/transfers/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/transfers"
  to = "/.netlify/functions/transfers"
  status = 200
  force = true

[[redirects]]
  from = "/merchant-profile"
  to = "/.netlify/functions/merchant-profile"
  status = 200
  force = true

[[redirects]]
  from = "/payment-reports/*"
  to = "/.netlify/functions/payment-reports/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/merchant-pos"
  to = "/.netlify/functions/merchant-pos"
  status = 200
  force = true

[[redirects]]
  from = "/charges"
  to = "/.netlify/functions/charges"
  status = 200
  force = true

[[redirects]]
  from = "/charges/*"
  to = "/.netlify/functions/charges/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/webhooks/mercadopago"
  to = "/.netlify/functions/mercadopago-webhook"
  status = 200
  force = true

# /rpc, /eth-rpc, /quote and /balance use native Function routes and rate limits.

# API de la agenda de contactos (Postgres vía Aiven, ver netlify/functions/contacts.js).
[[redirects]]
  from = "/contacts"
  to = "/.netlify/functions/contacts"
  status = 200
  force = true

# API del historial de transacciones (Postgres vía Aiven, ver netlify/functions/transactions.js).
[[redirects]]
  from = "/transactions"
  to = "/.netlify/functions/transactions"
  status = 200
  force = true

# Recaudadora: status público + payouts firmados server-side (TREASURY_SECRET_KEY).
[[redirects]]
  from = "/treasury"
  to = "/.netlify/functions/treasury"
  status = 200
  force = true

# Parser de voz vía Anthropic (ANTHROPIC_API_KEY server-side).
[[redirects]]
  from = "/parse-intent"
  to = "/.netlify/functions/parse-intent"
  status = 200
  force = true

# SPA: cualquier otra ruta sirve index.html (no hay react-router, pero
# evita 404 si alguien entra directo a una URL que no sea la raíz).
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
