<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#E7E7EE" />
    <link rel="icon" type="image/png" href="/logo-192.png" />
    <link rel="apple-touch-icon" href="/logo-192.png" />
    <title>MidatoPay × Solana</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <style>
      *, *::before, *::after { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
      html, body { height: 100%; }
      body {
        margin: 0;
        font-family: 'Poppins', -apple-system, system-ui, sans-serif;
        background: #E7E7EE;
        background-image: radial-gradient(900px 500px at 50% -10%, #F3EDFF 0%, #E7E7EE 60%);
      }

      /* Escenario: centra la app en pantallas grandes */
      .mp-stage {
        min-height: 100dvh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 26px 16px;
      }

      /* Marco tipo teléfono */
      .mp-device {
        --mp-nav-space: 96px;
        position: relative;
        width: 100%;
        max-width: 400px;
        height: min(840px, calc(100dvh - 52px));
        background: #FFFFFF;
        border-radius: 34px;
        overflow: hidden;
        display: flex;
        flex-direction: column;
        box-shadow:
          0 40px 90px rgba(24, 24, 44, .20),
          0 8px 24px rgba(24, 24, 44, .08),
          0 0 0 1px rgba(24, 24, 44, .05);
      }

      /* Reserva el alto de la botonera flotante como margen real, no solo padding,
         para que el viewport de scroll nunca se extienda detrás de ella. */
      .mp-scroll {
        flex: 1;
        margin-bottom: var(--mp-nav-space);
        overflow-y: auto;
        overscroll-behavior: contain;
        -webkit-overflow-scrolling: touch;
        scrollbar-width: none;
      }
      .mp-scroll::-webkit-scrollbar { width: 0; }
      .mp-device.mp-no-nav .mp-scroll { margin-bottom: 0; }

      /* Barra inferior glass + FAB cromado naranja */
      @property --fab-angle {
        syntax: "<angle>";
        initial-value: 0deg;
        inherits: false;
      }
      .mp-nav {
        position: absolute;
        left: 10px;
        right: 10px;
        bottom: 10px;
        background: linear-gradient(
          180deg,
          rgba(255, 255, 255, 0.88) 0%,
          rgba(255, 248, 242, 0.72) 48%,
          rgba(255, 236, 224, 0.78) 100%
        );
        backdrop-filter: blur(22px) saturate(1.55);
        -webkit-backdrop-filter: blur(22px) saturate(1.55);
        border: 1px solid rgba(255, 181, 141, 0.45);
        border-radius: 26px;
        padding: 10px 12px 12px;
        display: flex;
        align-items: center;
        overflow: visible;
        box-shadow:
          0 12px 40px rgba(254, 108, 28, 0.12),
          0 2px 0 rgba(255, 255, 255, 0.82) inset,
          0 -1px 0 rgba(254, 108, 28, 0.08) inset;
      }
      .mp-nav::before {
        content: "";
        position: absolute;
        left: 8%;
        right: 8%;
        top: 1px;
        height: 1px;
        background: linear-gradient(
          90deg,
          transparent 0%,
          rgba(255, 255, 255, 0.7) 50%,
          transparent 100%
        );
        pointer-events: none;
        z-index: 1;
      }
      .mp-fab {
        position: absolute;
        left: 50%;
        transform: translate(-50%, -28px);
        width: 64px;
        height: 64px;
        border-radius: 50%;
        background:
          radial-gradient(circle at 32% 24%, rgba(255, 255, 255, 0.38) 0%, rgba(255, 255, 255, 0) 40%),
          conic-gradient(
            from var(--fab-angle),
            #ffd0b2 0deg,
            #ffb58d 70deg,
            #fe6c1c 150deg,
            #e85a10 220deg,
            #fe6c1c 290deg,
            #ffb58d 330deg,
            #ffd0b2 360deg
          );
        border: 1.5px solid rgba(255, 255, 255, 0.55);
        color: #fff;
        cursor: pointer;
        display: grid;
        place-items: center;
        overflow: hidden;
        z-index: 3;
        box-shadow:
          0 14px 34px rgba(254, 108, 28, 0.42),
          0 2px 0 rgba(255, 255, 255, 0.45) inset,
          0 -6px 14px rgba(180, 55, 0, 0.22) inset;
        animation: mp-fab-spin 7s linear infinite;
        transition: transform .18s ease;
      }
      .mp-fab-shine {
        display: none;
      }
      .mp-fab:active {
        transform: translate(-50%, -28px) scale(.94);
      }
      .mp-fab.is-listening {
        box-shadow:
          0 18px 48px rgba(254, 108, 28, 0.5),
          0 0 0 6px rgba(254, 108, 28, 0.14),
          0 2px 0 rgba(255, 255, 255, 0.5) inset,
          0 -8px 18px rgba(180, 55, 0, 0.22) inset;
      }
      /* Cliente externo: paleta morada (no MidatoPay) */
      .mp-guest .mp-nav {
        background: linear-gradient(
          180deg,
          rgba(255, 255, 255, 0.9) 0%,
          rgba(246, 244, 252, 0.78) 48%,
          rgba(238, 235, 248, 0.82) 100%
        );
        border: 1px solid rgba(91, 77, 183, 0.28);
        box-shadow:
          0 12px 40px rgba(91, 77, 183, 0.12),
          0 2px 0 rgba(255, 255, 255, 0.82) inset,
          0 -1px 0 rgba(91, 77, 183, 0.08) inset;
      }
      .mp-guest .mp-fab {
        background:
          radial-gradient(circle at 32% 24%, rgba(255, 255, 255, 0.38) 0%, rgba(255, 255, 255, 0) 40%),
          conic-gradient(
            from var(--fab-angle),
            #b7afe0 0deg,
            #8b7fd4 70deg,
            #5b4db7 150deg,
            #4338a0 220deg,
            #5b4db7 290deg,
            #8b7fd4 330deg,
            #b7afe0 360deg
          );
        box-shadow:
          0 14px 34px rgba(91, 77, 183, 0.42),
          0 2px 0 rgba(255, 255, 255, 0.45) inset,
          0 -6px 14px rgba(50, 40, 120, 0.28) inset;
      }
      .mp-guest-scan {
        position: relative;
        min-height: 100%;
        height: 100%;
        background: #0b0b0d;
        color: #fff;
        overflow: hidden;
      }
      .mp-guest-scan-top {
        position: absolute;
        top: 14px;
        left: 14px;
        right: 14px;
        z-index: 5;
        display: flex;
        justify-content: space-between;
      }
      .mp-guest-scan-iconbtn {
        width: 40px;
        height: 40px;
        border-radius: 50%;
        border: none;
        background: rgba(0,0,0,.35);
        color: #fff;
        font-size: 28px;
        line-height: 1;
        cursor: pointer;
        font-family: inherit;
      }
      .mp-guest-scan-stage {
        position: absolute;
        inset: 0;
        overflow: hidden;
      }
      .mp-guest-scan-frame {
        position: absolute;
        left: 50%;
        top: 42%;
        width: 70%;
        max-width: 260px;
        aspect-ratio: 1;
        transform: translate(-50%, -50%);
        border: 2px dashed rgba(255,255,255,.85);
        border-radius: 18px;
        box-shadow: 0 0 0 999px rgba(0,0,0,.28);
        pointer-events: none;
        z-index: 2;
      }
      .mp-guest-scan-laser {
        position: absolute;
        left: 50%;
        top: 42%;
        width: 70%;
        max-width: 260px;
        height: 2px;
        transform: translate(-50%, -50%);
        background: linear-gradient(90deg, transparent, #5B4DB7, transparent);
        animation: mp-guest-laser 2.2s ease-in-out infinite;
        pointer-events: none;
        z-index: 3;
      }
      @keyframes mp-guest-laser {
        0%, 100% { transform: translate(-50%, -90px); opacity: .35; }
        50% { transform: translate(-50%, 90px); opacity: 1; }
      }
      .mp-guest-scan-bottom {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 0;
        z-index: 4;
        padding: 20px 22px 28px;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 16px;
        background: transparent;
        pointer-events: none;
      }
      .mp-guest-scan-bottom > * {
        pointer-events: auto;
      }
      .mp-guest-scan-flash {
        width: 52px;
        height: 52px;
        border-radius: 50%;
        border: none;
        background: rgba(0,0,0,.4);
        color: #fff;
        display: grid;
        place-items: center;
        cursor: pointer;
        font-family: inherit;
        padding: 0;
      }
      .mp-guest-scan-flash.is-on {
        background: rgba(91, 77, 183, 0.92);
        color: #fff;
      }
      /* Pagar logueado: misma UI de scan, paleta naranja MidatoPay */
      .mp-pay-scan .mp-guest-scan-laser {
        background: linear-gradient(90deg, transparent, #fe6c1c, transparent);
      }
      .mp-pay-scan .mp-guest-scan-flash.is-on {
        background: rgba(254, 108, 28, 0.92);
        color: #fff;
      }

      /* Onboarding / splash pre-login */
      .mp-onboard {
        background:
          radial-gradient(120% 80% at 50% -10%, #ffb58d 0%, #fe6c1c 42%, #1a0f0a 100%);
        color: #fff;
      }
      .mp-onboard-welcome {
        background: linear-gradient(180deg, #ffffff 0%, #fffaf7 70%, #fff5ee 100%);
        color: #1a1a1a;
        overflow: hidden;
      }
      .mp-onboard-welcome .mp-onboard-shell {
        padding: 18px 22px 24px;
      }
      .mp-onboard-welcome .mp-onboard-shell::before {
        content: none;
      }
      .mp-onboard-hero {
        position: relative;
        z-index: 1;
        flex: 1 1 auto;
        display: flex;
        align-items: flex-start;
        justify-content: center;
        min-height: 0;
        margin: 4px 0 -8px;
        padding-top: 28px;
      }
      .mp-onboard-hero::before {
        content: "";
        position: absolute;
        left: 50%;
        top: 42%;
        transform: translate(-50%, -50%);
        width: min(100%, 400px);
        height: min(100%, 400px);
        border-radius: 50%;
        background: radial-gradient(
          circle,
          rgba(254, 108, 28, 0.22) 0%,
          rgba(255, 181, 141, 0.12) 32%,
          rgba(254, 108, 28, 0.04) 52%,
          transparent 70%
        );
        filter: blur(28px);
        z-index: 0;
        pointer-events: none;
      }
      .mp-onboard-hero img {
        position: relative;
        z-index: 1;
        width: min(124%, 480px);
        max-height: 84%;
        height: auto;
        object-fit: contain;
        display: block;
        filter: drop-shadow(0 14px 28px rgba(254, 108, 28, 0.16));
        user-select: none;
        pointer-events: none;
      }
      .mp-onboard-welcome .mp-onboard-welcome-body {
        flex: 0 0 auto;
        justify-content: flex-start;
        padding-top: 0;
        padding-bottom: 12px;
        margin-bottom: 22px;
      }
      .mp-onboard-welcome .mp-onboard-brand {
        color: #1a1a1a;
      }
      .mp-onboard-welcome .mp-onboard-eyebrow {
        color: #fe6c1c;
        margin-bottom: 8px;
      }
      .mp-onboard-welcome .mp-onboard-title {
        color: #1a1a1a;
        font-size: 36px;
        line-height: 1.12;
      }
      .mp-onboard-welcome .mp-onboard-title-line {
        display: block;
        white-space: nowrap;
      }
      .mp-onboard-welcome .mp-onboard-sub {
        color: rgba(26, 26, 26, 0.62);
        margin-top: 8px;
        font-size: 14px;
        max-width: 34ch;
      }
      .mp-onboard-welcome .mp-onboard-slide-cta {
        background: radial-gradient(circle at 0% 0%, #fe6c1c 0%, #ffb58d 18%, #fe6c1c 42%, #fe6c1c 100%);
        box-shadow: 0 10px 22px rgba(254, 108, 28, 0.28);
      }
      .mp-onboard-welcome .mp-onboard-slide-cta.is-done {
        background: radial-gradient(circle at 0% 0%, #ffb58d 0%, #fe6c1c 40%, #fe6c1c 100%);
      }
      .mp-onboard-welcome .mp-onboard-slide-fill {
        background: linear-gradient(90deg, rgba(255, 255, 255, 0.28), rgba(255, 255, 255, 0.06));
      }
      .mp-onboard-welcome .mp-onboard-slide-label {
        color: #fff;
      }
      .mp-onboard-welcome .mp-onboard-slide-chevs {
        color: rgba(255, 255, 255, 0.7);
      }
      .mp-onboard-welcome .mp-onboard-slide-knob {
        background: #fff;
        color: #1a0f0a;
      }
      .mp-onboard-shell {
        position: relative;
        height: 100%;
        display: flex;
        flex-direction: column;
        padding: 22px 22px 28px;
        box-sizing: border-box;
        overflow: hidden;
      }
      .mp-onboard-splash {
        height: 100%;
        display: grid;
        place-items: center;
        animation: mp-onboard-fade 0.6s ease both;
      }
      .mp-onboard-splash-logo {
        width: min(32%, 120px);
        height: auto;
        display: block;
        animation: mp-onboard-pulse 1.6s ease-in-out infinite;
      }
      .mp-onboard-top {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        z-index: 2;
        flex-shrink: 0;
      }
      .mp-onboard-top-slides {
        justify-content: flex-end;
      }
      .mp-onboard-brand {
        font-size: 18px;
        font-weight: 700;
        letter-spacing: -0.3px;
        color: #fff;
      }
      .mp-onboard-brand span { color: #fe6c1c; }
      .mp-onboard-welcome-body {
        position: relative;
        z-index: 1;
        flex: 1;
        display: flex;
        flex-direction: column;
        justify-content: flex-end;
        padding-bottom: 18px;
        min-height: 0;
      }
      .mp-onboard-slide {
        position: relative;
        z-index: 1;
        flex: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: flex-end;
        text-align: center;
        padding: 12px 8px 0;
        min-height: 0;
        animation: mp-onboard-slide-in 0.45s ease both;
      }
      .mp-onboard-slide-visual {
        flex: 1;
        width: 100%;
        min-height: 0;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .mp-onboard-slide-visual img {
        width: auto;
        height: auto;
        max-width: 88%;
        max-height: 100%;
        object-fit: contain;
        display: block;
        pointer-events: none;
        user-select: none;
      }
      .mp-onboard-slide-visual.is-last img {
        max-width: 102%;
        max-height: 112%;
      }
      .mp-onboard-title {
        margin: 0;
      }
      .mp-onboard-eyebrow {
        font-size: 13px;
        font-weight: 600;
        color: #ffd0b2;
        margin-bottom: 10px;
      }
      .mp-onboard-title {
        margin: 0;
        font-size: 30px;
        font-weight: 700;
        letter-spacing: -0.6px;
        line-height: 1.22;
        color: #fff;
      }
      .mp-onboard-hi { color: #ffb58d; }
      .mp-onboard-sub {
        margin: 12px 0 0;
        font-size: 15px;
        line-height: 1.45;
        color: rgba(255,255,255,0.78);
        max-width: 32ch;
      }
      .mp-onboard-dots {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        margin: 22px 0 18px;
        z-index: 1;
      }
      .mp-onboard-dot {
        width: 6px;
        height: 6px;
        border: none;
        border-radius: 50%;
        padding: 0;
        background: rgba(255,255,255,0.28);
        cursor: pointer;
      }
      .mp-onboard-dot.is-active {
        background: #fe6c1c;
        transform: scale(1.15);
      }
      .mp-onboard-auth {
        display: flex;
        flex-direction: column;
        align-items: stretch;
        gap: 14px;
        flex-shrink: 0;
        z-index: 1;
      }
      .mp-onboard-create {
        background: none;
        border: none;
        color: rgba(255,255,255,0.88);
        font-size: 15px;
        font-weight: 600;
        font-family: inherit;
        text-decoration: underline;
        text-underline-offset: 4px;
        cursor: pointer;
        padding: 4px 0 8px;
        opacity: 1;
      }
      .mp-onboard-create:disabled {
        opacity: 0.5;
        cursor: default;
      }
      .mp-onboard-slide-cta {
        position: relative;
        width: 100%;
        height: 52px;
        border-radius: 999px;
        background: radial-gradient(circle at 0% 0%, #fe6c1c 0%, #ffb58d 18%, #fe6c1c 42%, #fe6c1c 100%);
        box-shadow: 0 10px 24px rgba(0,0,0,0.22);
        z-index: 1;
        touch-action: none;
        user-select: none;
        -webkit-user-select: none;
        overflow: hidden;
        flex-shrink: 0;
        transition: transform 0.18s ease, box-shadow 0.18s ease;
        --mp-slide-p: 0;
      }
      .mp-onboard-slide-cta.is-dragging {
        transform: scale(1.015);
        box-shadow: 0 14px 30px rgba(0,0,0,0.28);
      }
      .mp-onboard-slide-cta.is-done {
        background: radial-gradient(circle at 0% 0%, #ffb58d 0%, #fe6c1c 40%, #fe6c1c 100%);
      }
      .mp-onboard-slide-fill {
        position: absolute;
        inset: 0 auto 0 0;
        width: 0;
        background: linear-gradient(90deg, rgba(255,255,255,0.28), rgba(255,255,255,0.08));
        pointer-events: none;
        transition: width 0.22s ease;
        opacity: calc(0.35 + (var(--mp-slide-p) * 0.65));
      }
      .mp-onboard-slide-cta.is-dragging .mp-onboard-slide-fill {
        transition: none;
      }
      .mp-onboard-slide-label {
        position: absolute;
        inset: 0;
        display: grid;
        place-items: center;
        color: #fff;
        font-size: 16px;
        font-weight: 700;
        font-family: inherit;
        letter-spacing: -0.2px;
        pointer-events: none;
        z-index: 1;
        opacity: calc(1 - (var(--mp-slide-p) * 0.85));
        transform: translateX(calc(var(--mp-slide-p) * -10px));
        transition: opacity 0.12s ease;
      }
      .mp-onboard-slide-chevs {
        position: absolute;
        right: 16px;
        top: 50%;
        transform: translateY(-50%);
        display: flex;
        align-items: center;
        gap: 6px;
        color: rgba(255,255,255,0.75);
        pointer-events: none;
        z-index: 1;
        opacity: calc(1 - (var(--mp-slide-p) * 1.1));
      }
      .mp-onboard-slide-chevs svg {
        width: 11px;
        height: 18px;
        display: block;
        opacity: 0.55;
      }
      .mp-onboard-slide-chevs svg:nth-child(1) { opacity: 0.4; }
      .mp-onboard-slide-chevs svg:nth-child(2) { opacity: 0.65; }
      .mp-onboard-slide-chevs svg:nth-child(3) { opacity: 0.9; }
      .mp-onboard-slide-cta.is-dragging .mp-onboard-slide-chevs svg {
        animation: mp-onboard-chev 0.7s ease-in-out infinite;
      }
      .mp-onboard-slide-cta.is-dragging .mp-onboard-slide-chevs svg:nth-child(2) {
        animation-delay: 0.1s;
      }
      .mp-onboard-slide-cta.is-dragging .mp-onboard-slide-chevs svg:nth-child(3) {
        animation-delay: 0.2s;
      }
      .mp-onboard-slide-knob {
        position: absolute;
        left: 4px;
        top: 4px;
        width: 44px;
        height: 44px;
        border-radius: 50%;
        border: none;
        padding: 0;
        background: #fff;
        color: #1a0f0a;
        display: grid;
        place-items: center;
        cursor: grab;
        z-index: 2;
        box-shadow: none;
        touch-action: none;
        font-family: inherit;
        transition: transform 0.22s ease;
        will-change: transform;
      }
      .mp-onboard-slide-knob.is-dragging {
        transition: none;
        cursor: grabbing;
        filter: brightness(1.03);
      }
      .mp-onboard-slide-knob.is-dragging svg {
        transform: translateX(2px);
      }
      .mp-onboard-slide-knob:active { cursor: grabbing; }
      .mp-onboard-slide-knob svg {
        width: 20px;
        height: 20px;
        display: block;
        transition: transform 0.15s ease;
      }
      @keyframes mp-onboard-chev {
        0%, 100% { transform: translateX(0); opacity: 0.45; }
        50% { transform: translateX(3px); opacity: 1; }
      }
      @keyframes mp-onboard-fade {
        from { opacity: 0; transform: scale(0.96); }
        to { opacity: 1; transform: scale(1); }
      }
      @keyframes mp-onboard-pulse {
        0%, 100% { transform: scale(1); opacity: 1; }
        50% { transform: scale(1.04); opacity: 0.92; }
      }
      @keyframes mp-onboard-slide-in {
        from { opacity: 0; transform: translateY(14px); }
        to { opacity: 1; transform: translateY(0); }
      }

      .mp-voice-sheet {
        position: absolute;
        inset: 0 0 128px 0;
        z-index: 35;
        display: flex;
        flex-direction: column;
        justify-content: flex-end;
        padding: 18px 18px 8px;
        background: rgba(255, 255, 255, 0.78);
        backdrop-filter: blur(10px);
        -webkit-backdrop-filter: blur(10px);
        overflow-y: auto;
      }

      /* Orbe cromado grande (pantalla voz) */
      .mp-chrome-orb {
        width: 124px;
        height: 124px;
        border-radius: 50%;
        border: 1.5px solid rgba(255, 255, 255, 0.55);
        color: #fff;
        cursor: pointer;
        display: grid;
        place-items: center;
        overflow: hidden;
        background:
          radial-gradient(circle at 32% 24%, rgba(255, 255, 255, 0.42) 0%, rgba(255, 255, 255, 0) 42%),
          conic-gradient(
            from var(--fab-angle),
            #ffd0b2 0deg,
            #ffb58d 70deg,
            #fe6c1c 150deg,
            #e85a10 220deg,
            #fe6c1c 290deg,
            #ffb58d 330deg,
            #ffd0b2 360deg
          );
        box-shadow:
          0 16px 40px rgba(254, 108, 28, 0.38),
          0 2px 0 rgba(255, 255, 255, 0.45) inset,
          0 -8px 18px rgba(180, 55, 0, 0.22) inset;
        animation: mp-fab-spin 7s linear infinite;
        transition: transform .18s ease, opacity .2s ease;
      }
      .mp-chrome-orb:active { transform: scale(.96); }
      .mp-chrome-orb:disabled { opacity: 0.72; cursor: default; }
      .mp-chrome-orb.is-listening {
        box-shadow:
          0 18px 48px rgba(254, 108, 28, 0.48),
          0 0 0 8px rgba(254, 108, 28, 0.08),
          0 2px 0 rgba(255, 255, 255, 0.5) inset,
          0 -8px 18px rgba(180, 55, 0, 0.22) inset;
      }
      .mp-voice-glass {
        background: linear-gradient(
          180deg,
          rgba(255, 255, 255, 0.72) 0%,
          rgba(255, 245, 238, 0.55) 100%
        );
        backdrop-filter: blur(14px) saturate(1.3);
        -webkit-backdrop-filter: blur(14px) saturate(1.3);
        border: 1px solid rgba(255, 181, 141, 0.35);
        box-shadow:
          0 8px 28px rgba(254, 108, 28, 0.06),
          0 1px 0 rgba(255, 255, 255, 0.8) inset;
      }

      @keyframes mp-fab-spin {
        to { --fab-angle: 360deg; }
      }
      @keyframes mp-voice-ring {
        0% { transform: scale(1); opacity: 0.45; }
        100% { transform: scale(1.7); opacity: 0; }
      }

      @media (prefers-reduced-motion: reduce) {
        .mp-fab,
        .mp-chrome-orb { animation: none; }
      }

      /* Overlays dentro del marco */
      .mp-overlay {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 40;
      }

      button:focus-visible, input:focus-visible, a:focus-visible {
        outline: 2px solid #5C4CC7;
        outline-offset: 2px;
      }

      /* En celular: pantalla completa, sin marco */
      @media (max-width: 520px) {
        body { background: #FFFFFF; background-image: none; }
        .mp-stage { padding: 0; }
        .mp-device {
          --mp-nav-space: calc(96px + 12px + env(safe-area-inset-bottom));
          max-width: none;
          height: 100dvh;
          border-radius: 0;
          box-shadow: none;
        }
        .mp-nav {
          bottom: calc(10px + env(safe-area-inset-bottom));
          padding-bottom: 12px;
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
